<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik - Transparansi Dana Desa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981',
                        secondary: '#059669',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center space-x-4">
                <i class="fas fa-landmark text-4xl"></i>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold">Sistem Transparansi Dana Desa</h1>
                    <p class="text-sm md:text-base opacity-90" id="desaInfo">Loading...</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <ul class="flex space-x-2 md:space-x-8 overflow-x-auto">
                <li><a href="index.html" class="block py-4 px-4 text-gray-600 hover:text-primary transition">Dashboard</a></li>
                <li><a href="program.html" class="block py-4 px-4 text-gray-600 hover:text-primary transition">Data Program</a></li>
                <li><a href="grafik.html" class="block py-4 px-4 text-primary border-b-2 border-primary font-semibold">Grafik</a></li>
                <li><a href="admin.html" class="block py-4 px-4 text-gray-600 hover:text-primary transition">Admin</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Pie Chart -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Distribusi Anggaran per Kategori</h2>
                <canvas id="pieChart"></canvas>
            </div>

            <!-- Bar Chart -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Anggaran vs Realisasi</h2>
                <canvas id="barChart"></canvas>
            </div>

            <!-- Status Chart -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Status Pelaksanaan Program</h2>
                <canvas id="statusChart"></canvas>
            </div>

            <!-- Progress Chart -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Persentase Realisasi per Kategori</h2>
                <canvas id="progressChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 Pemerintah Desa. Sistem Transparansi Dana Desa.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            await loadDesaInfo();
            await loadCharts();
        });
    </script>
</body>
</html>
