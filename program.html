<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Program - Transparansi Dana Desa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981',
                        secondary: '#059669',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center space-x-4">
                <i class="fas fa-landmark text-4xl"></i>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold">Sistem Transparansi Dana Desa</h1>
                    <p class="text-sm md:text-base opacity-90" id="desaInfo">Loading...</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <ul class="flex space-x-2 md:space-x-8 overflow-x-auto">
                <li><a href="index.html" class="block py-4 px-4 text-gray-600 hover:text-primary transition">Dashboard</a></li>
                <li><a href="program.html" class="block py-4 px-4 text-primary border-b-2 border-primary font-semibold">Data Program</a></li>
                <li><a href="grafik.html" class="block py-4 px-4 text-gray-600 hover:text-primary transition">Grafik</a></li>
                <li><a href="admin.html" class="block py-4 px-4 text-gray-600 hover:text-primary transition">Admin</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Data Program Dana Desa</h2>
            
            <!-- Filter Section -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Cari Program</label>
                    <input type="text" id="searchInput" placeholder="Cari nama program..." 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Kategori</label>
                    <select id="filterKategori" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">Semua Kategori</option>
                        <option value="Infrastruktur">Infrastruktur</option>
                        <option value="Sosial">Sosial</option>
                        <option value="Pendidikan">Pendidikan</option>
                        <option value="Kesehatan">Kesehatan</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                    <select id="filterStatus" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">Semua Status</option>
                        <option value="Perencanaan">Perencanaan</option>
                        <option value="Proses">Proses</option>
                        <option value="Selesai">Selesai</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-primary text-white">
                        <tr>
                            <th class="px-4 py-3 text-left">No</th>
                            <th class="px-4 py-3 text-left">Nama Program</th>
                            <th class="px-4 py-3 text-left">Kategori</th>
                            <th class="px-4 py-3 text-right">Anggaran</th>
                            <th class="px-4 py-3 text-right">Realisasi</th>
                            <th class="px-4 py-3 text-center">Status</th>
                            <th class="px-4 py-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="programTable" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="7" class="px-4 py-8 text-center text-gray-500">
                                <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
                                <p>Memuat data...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 Pemerintah Desa. Sistem Transparansi Dana Desa.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            await loadDesaInfo();
            await loadProgramTable();
            
            // Event listeners for filters
            document.getElementById('searchInput').addEventListener('input', filterPrograms);
            document.getElementById('filterKategori').addEventListener('change', filterPrograms);
            document.getElementById('filterStatus').addEventListener('change', filterPrograms);
        });
    </script>
</body>
</html>
